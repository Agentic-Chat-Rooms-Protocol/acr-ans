apiVersion: v1
kind: Secret
metadata:
  name: route-ans-secrets
  namespace: route-ans
  labels:
    app: route-ans
type: Opaque
stringData:
  # Redis password (optional)
  redis.password: ""
  
  # GoDaddy API credentials
  # Get these from: https://developer.godaddy.com/keys
  # Format: <key>:<secret>
  godaddy.api.key: "YOUR_GODADDY_API_KEY"
  godaddy.api.secret: "YOUR_GODADDY_API_SECRET"
