# ANS Resolution Server Configuration - GoDaddy Registry with Redis
# This configuration connects to GoDaddy's ANS Registry and uses Redis for caching

# Server configuration
server:
  host: 0.0.0.0
  port: 8080
  readTimeout: 30s
  writeTimeout: 30s
  idleTimeout: 120s
  maxHeaderBytes: 1048576  # 1MB
  gracefulShutdownTimeout: 30s

# Cache configuration - Using Redis
cache:
  provider: redis
  ttl:
    default: 300s      # 5 minutes
    verified: 600s     # 10 minutes
    revoked: 3600s     # 1 hour
    notFound: 60s      # 1 minute
  redis:
    address: ${REDIS_ADDRESS:localhost:6379}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}
    maxRetries: 3
    poolSize: 10
    minIdleConns: 5
    dialTimeout: 5s
    readTimeout: 3s
    writeTimeout: 3s
    poolTimeout: 4s
    idleTimeout: 5m
    keyPrefix: ans:cache

# Queue configuration - Using Redis Streams
queue:
  enabled: false  # Queue not implemented yet
  provider: redis
  redis:
    address: ${REDIS_ADDRESS:localhost:6379}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}
    streamKey: ans:queue:events
    consumerGroup: ans-resolver
    consumerName: ${HOSTNAME:resolver-1}
    maxRetries: 3

# Registry adapters - GoDaddy configuration
registries:
  - name: godaddy
    type: godaddy
    enabled: true
    priority: 1
    timeout: 10s
    retries: 3
    retryBackoff: 1s
    config:
      # GoDaddy API configuration
      baseURL: "https://api.godaddy.com/v1"
      # For testing with OTE (Operational Test Environment), use:
      # baseURL: "https://api.ote-godaddy.com/v1"
      
      # Your GoDaddy API credentials
      # Get these from: https://developer.godaddy.com/keys
      apiKey: "${GODADDY_API_KEY}"
      apiSecret: "${GODADDY_API_SECRET}"

# Trust and verification settings
trust:
  provider: file
  verification:
    enabled: false
    mode: permissive  # permissive | strict | disabled
    requireSignature: true
    requireMerkleProof: false  # GoDaddy may not support Merkle proofs yet
    checkRevocation: false
    allowExpiredGracePeriod: 24h
    ocsp:
      enabled: false
      timeout: 5s
    crl:
      enabled: false
      cacheTimeout: 1h
  file:
    trustedRootsFile: /etc/ans/trusted-roots.pem
    trustedRegistrarsFile: /etc/ans/trusted-registrars.json

# Rate limiting
rateLimit:
  enabled: true
  limits:
    anonymous:
      requests: 100
      window: 1m
    authenticated:
      requests: 1000
      window: 1m

# Telemetry configuration
telemetry:
  logging:
    level: info        # debug | info | warn | error
    format: json       # json | text
    output: stdout     # stdout | stderr | file
    file:
      path: /var/log/ans-resolver/resolver.log
      maxSize: 100     # MB
      maxBackups: 3
      maxAge: 28       # days
      compress: true
  metrics:
    enabled: true
    namespace: ans
    subsystem: resolver
    path: /metrics
    port: 9091
    host: 0.0.0.0
  tracing:
    enabled: false
    provider: otlp     # otlp | jaeger | zipkin
    endpoint: localhost:4317
    samplingRate: 0.1
